name: Dynamic README

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, so the activity card's time-of-day palette actually cycles
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Hero card (dark.svg / light.svg): greeting, role rotation, skills +
      # a live "Şu An Dinliyorum" Spotify strip. Spotify secrets are
      # optional — falls back to "not connected" if unset (see SETUP.md).
      - name: Generate hero card
        run: python scripts/generate_hero_card.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      # No account/keys needed — regenerates activity-dark.svg / activity-light.svg
      - name: Generate live activity card
        run: python scripts/generate_activity_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pulls your most-recently-pushed public repos — regenerates working-on-dark.svg / working-on-light.svg
      - name: Generate "currently working on" card
        run: python scripts/generate_projects_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Sums /languages across all repos — regenerates langs-dark.svg / langs-light.svg.
      # GH_PAT is optional: if set (fine-grained PAT, own account only), private
      # repos are included in the language mix too. Never used by the activity
      # or "working on" cards, so no private push timing is ever exposed.
      - name: Generate language breakdown card
        run: python scripts/generate_languages_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.PRIVATE_REPO_PAT }}

      # Stars/repos/followers/PRs/issues/forks via REST + Search API —
      # regenerates stats-dark.svg / stats-light.svg (no third-party service).
      # Same optional GH_PAT as above, to also count private repos.
      - name: Generate GitHub stats card
        run: python scripts/generate_stats_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh hero, activity, working-on, languages & stats cards"
          file_pattern: >-
            dark.svg light.svg
            activity-dark.svg activity-light.svg
            working-on-dark.svg working-on-light.svg
            langs-dark.svg langs-light.svg
            stats-dark.svg stats-light.svg
