  </linearGradient>
</defs>
<rect width="1180" height="140" rx="24" fill="#FFFFFF"/>
<g clip-path="url(#cardClip)">
  <rect x="12" y="12" width="1156" height="116" rx="18" fill="#F8FAFC" fill-opacity="0.8" stroke="#0F172A" stroke-opacity="0.08" stroke-width="1"/>
