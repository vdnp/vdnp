<svg width="1180" height="252" viewBox="0 0 1180 252" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
  <clipPath id="cardClip"><rect x="0" y="0" width="1180" height="252" rx="24"/></clipPath>
  <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#312E81"><animate attributeName="stop-color" values="#312E81;#6366F1;#7C3AED;#312E81" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="50%" stop-color="#6366F1"><animate attributeName="stop-color" values="#6366F1;#7C3AED;#312E81;#6366F1" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="100%" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#312E81;#6366F1;#7C3AED" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#312E81" stop-opacity="0.3"/><stop offset="100%" stop-color="#312E81" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#6366F1" stop-opacity="0.28"/><stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="borderShimmer" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="100" y2="0">
    <stop offset="0%" stop-color="#312E81" stop-opacity="0"/>
    <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1480 0;0 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<rect width="1180" height="252" rx="24" fill="#FFFFFF"/>
<g clip-path="url(#cardClip)">
  <circle cx="110" cy="20" r="140" fill="url(#glow1)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 20,10; -8,15; 0,0" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="232" r="160" fill="url(#glow2)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -15,-10; 10,8; 0,0" dur="16s" repeatCount="indefinite"/>
  </circle>
  <rect x="12" y="12" width="1156" height="228" rx="18" fill="#F8FAFC" fill-opacity="0.8" stroke="#0F172A" stroke-opacity="0.08" stroke-width="1"/>
  <rect x="12" y="12" width="1156" height="228" rx="18" fill="none" stroke="url(#borderShimmer)" stroke-width="1.4"/>
  <text x="42" y="38" font-size="11" letter-spacing="2" fill="#475569">ŞU AN ÜZERİNDE ÇALIŞTIKLARIM · en son push edilenler</text>
  <text x="1138" y="38" text-anchor="end" font-size="12" fill="#475569">🌙 GECE</text>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.25s" fill="freeze"/>
    <circle cx="44" cy="82" r="4" fill="url(#accentGrad)"/>
    <text x="60" y="88" font-size="16" font-weight="700" fill="#0F172A">vdnp</text>
    <text x="60" y="108" font-size="13" fill="#475569">Açıklama eklenmemiş</text>
    <text x="1136" y="88" text-anchor="end" font-size="12" font-family="'Courier New',monospace" fill="#475569">Python  ·  3sa önce</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.50s" fill="freeze"/>
    <circle cx="44" cy="136" r="4" fill="url(#accentGrad)"/>
    <text x="60" y="142" font-size="16" font-weight="700" fill="#0F172A">IDE</text>
    <text x="60" y="162" font-size="13" fill="#475569">Açıklama eklenmemiş</text>
    <text x="1136" y="142" text-anchor="end" font-size="12" font-family="'Courier New',monospace" fill="#475569">TypeScript  ·  12sa önce</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.75s" fill="freeze"/>
    <circle cx="44" cy="190" r="4" fill="url(#accentGrad)"/>
    <text x="60" y="196" font-size="16" font-weight="700" fill="#0F172A">vdnp.github.io</text>
    <text x="60" y="216" font-size="13" fill="#475569">Açıklama eklenmemiş</text>
    <text x="1136" y="196" text-anchor="end" font-size="12" font-family="'Courier New',monospace" fill="#475569">HTML  ·  6g önce</text>
  </g>
</g>
<rect x="1" y="1" width="1178" height="250" rx="23" fill="none" stroke="#0F172A" stroke-opacity="0.06"/>
</svg>
